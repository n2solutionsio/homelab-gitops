# kube-prometheus-stack Helm values for homelab k3s cluster

# Disable k3s-incompatible default rules and specific alerts
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
  disabled:
    KubeProxyDown: true
    KubeSchedulerDown: true
    KubeControllerManagerDown: true

# AlertManager with Slack notifications
alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.homelab.n2solutions.io
    tls:
      - hosts:
          - alertmanager.homelab.n2solutions.io
  alertmanagerSpec:
    secrets:
      - alertmanager-slack-webhook
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-client
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-warnings
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor|TrivyCriticalVulnerabilityFound"
        # Fork: every critical/warning alert ALSO goes to the n8n webhook so
        # the incident-pipeline workflow can persist it as a GitHub issue.
        # continue: true keeps the alert flowing to Slack receivers below.
        - receiver: n8n-incidents
          matchers:
            - severity =~ "critical|warning"
          continue: true
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
        - receiver: slack-critical
          matchers:
            - severity = critical
          repeat_interval: 1h
          continue: false
        - receiver: slack-warnings
          matchers:
            - severity = warning
          repeat_interval: 4h
        - receiver: slack-warnings
          matchers:
            - severity = info
          repeat_interval: 24h
    receivers:
      - name: "null"
      - name: n8n-incidents
        webhook_configs:
          # n8n workflow "Alert Incident Pipeline" — see manifests/n8n/README.md
          # for the workflow design and import steps. The webhook node listens
          # on path /webhook/alertmanager-incident.
          - url: http://n8n.n8n.svc.cluster.local:80/webhook/alertmanager-incident
            send_resolved: true
            max_alerts: 0  # no truncation; let n8n iterate the full set
      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url
            channel: "#incidents"
            send_resolved: true
            title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              <!channel> *CRITICAL ALERT*

              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}

              *Description:* {{ .Annotations.description }}

              *Namespace:* {{ .Labels.namespace }}

              *Node:* {{ if .Labels.node }}{{ .Labels.node }}{{ else if .Labels.instance }}{{ .Labels.instance }}{{ else }}N/A{{ end }}

              {{ end }}
      - name: slack-warnings
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url
            channel: "#incidents"
            send_resolved: true
            title: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }} ({{ .Labels.severity }})

              *Description:* {{ .Annotations.description }}

              *Namespace:* {{ .Labels.namespace }}

              *Node:* {{ if .Labels.node }}{{ .Labels.node }}{{ else if .Labels.instance }}{{ .Labels.instance }}{{ else }}N/A{{ end }}

              {{ end }}
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: [alertname, namespace]
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal: [alertname, namespace]

# Prometheus configuration
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-client
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    # Discover ALL ServiceMonitors, not just chart-labeled ones
    serviceMonitorSelector:
      matchLabels: {}
    podMonitorSelector:
      matchLabels: {}
    # Resource limits — no defaults set by the chart. Without these,
    # Prometheus had 17 restart cycles in 14h (issue #150): kubelet
    # liveness probe timed out during compactions, container killed.
    # Pinning memory gives the heap room without sharing with neighbors;
    # CPU lets compactions complete inside the probe failureThreshold.
    # Current idle: ~1Gi memory, ~0m CPU; under load: spikes to several
    # hundred m. 4Gi memory limit / 2 CPU limit gives headroom; requests
    # match observed baseline.
    resources:
      requests:
        # CPU request reduced from 500m → 100m: Prometheus idles near 0m and
        # the cluster (with worker-1 cordoned during runtime-instability
        # remediation) didn't have 500m headroom on worker-0/worker-2 to
        # admit the pod. Limit stays at 2 CPU — bursts during compaction
        # are absorbed there, not blocked at the scheduler.
        cpu: 100m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

# Grafana configuration
grafana:
  sidecar:
    dashboards:
      searchNamespace: ALL
      folderAnnotation: grafana_folder
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: nfs-client
    size: 5Gi
  # Loki was originally provisioned without an explicit uid, so Grafana
  # auto-assigned a random one (`P8E80F9AEF21F6940`). UIDs are immutable
  # post-creation, so the only way to give it the stable `uid: loki` we
  # need for cross-references is to delete + recreate it via provisioning.
  # Runs on Grafana startup before the datasources block; brief Loki
  # unavailability during recreation (seconds). No dashboards in repo
  # or in cluster hardcode the old random uid (verified).
  deleteDatasources:
    - name: Loki
      orgId: 1
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.logging.svc.cluster.local:80
      isDefault: false
      jsonData:
        maxLines: 1000
        # Derived field: detect TraceID-shaped substrings in log lines
        # (trace_id=<hex>, traceID=<hex>, traceId: <hex>, etc.) and turn
        # them into a clickable link that opens the trace in Tempo.
        #
        # Regex notes: Grafana applies derivedFields client-side in JavaScript.
        # JS regex does NOT support inline `(?i)` flag — produces
        # "Invalid regular expression: Invalid group" at log-render time and
        # breaks every Loki query. Use character classes for case-insensitivity
        # on the "id" suffix; widen the hex range to cover upper + lower case.
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: "trace[_-]?[iI][dD][\"=:\\s]+([a-fA-F0-9]+)"
            name: TraceID
            url: "$${__value.raw}"
            urlDisplayLabel: "View in Tempo"
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      # HTTP query API is on 3200 (chart names this port
      # "tempo-prom-metrics" — misleading; it serves both Prom metrics
      # AND /api/search and TraceQL queries).
      url: http://tempo.tracing.svc.cluster.local:3200
      isDefault: false
      jsonData:
        nodeGraph:
          enabled: true
        # Span → log links: from any span in Tempo, Grafana opens Loki
        # filtered by service.name == span's service.name within the
        # span's time window (±1h gives breathing room for upstream/
        # downstream context).
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          tags:
            - key: service.name
              value: app
          filterByTraceID: false
          filterBySpanID: false
        # Span → metrics links: pull Prometheus series for the span's
        # service over the span's time window.
        tracesToMetrics:
          datasourceUid: prometheus
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          tags:
            - key: service.name
              value: service
        # Service map: visualize call topology from span relationships,
        # backed by Prometheus span-derived metrics.
        serviceMap:
          datasourceUid: prometheus
    - name: PostgreSQL
      type: postgres
      access: proxy
      url: postgresql.postgresql.svc.cluster.local:5432
      user: postgres
      database: content_metrics
      isDefault: false
      secureJsonData:
        password: $PG_PASSWORD
      jsonData:
        database: content_metrics
        sslmode: disable
        postgresVersion: 1600
    - name: PostgreSQL - AI Org
      uid: pg-aiorg
      type: postgres
      access: proxy
      url: postgresql.postgresql.svc.cluster.local:5432
      user: grafana_readonly
      database: ai_org
      isDefault: false
      secureJsonData:
        password: $PG_AIORG_PASSWORD
      jsonData:
        database: ai_org
        sslmode: disable
        postgresVersion: 1600
  envFromSecrets:
    - name: grafana-postgres-datasource
      optional: false
    - name: grafana-pg-aiorg
      optional: false
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.homelab.n2solutions.io
    tls:
      - hosts:
          - grafana.homelab.n2solutions.io
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: grafana-dashboards
          orgId: 1
          folder: Proxmox
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/grafana-dashboards
  dashboards:
    grafana-dashboards:
      proxmox-overview:
        gnetId: 10347
        revision: 5
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      proxmox-fleet:
        gnetId: 24550
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus

# k3s doesn't expose these components via standard ServiceMonitor endpoints
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
