# Alerting on secret-sync health. This is the guardrail against the silent-expiry
# failure mode that has bitten us repeatedly (orchestrator#43, audit orchestrator#51):
# an ExternalSecret goes Ready=False — expired credential, missing backing key,
# failed generator — and nothing surfaces until a pod rollout forces a fresh
# fetch and crashloops. These alerts make ESO tell us BEFORE that happens.
#
# Requires ESO metrics scraping (see manifests/external-secrets/resources/podmonitor-metrics.yaml).
# ruleSelector on this cluster's Prometheus matches release=monitoring.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: external-secrets-sync
      rules:
        # An ExternalSecret has been failing to sync for 15m. Catches expired
        # tokens, missing OpenBao keys, and failed generators (e.g. a GitHub App
        # token that won't mint) before a pod restart turns it into an outage.
        - alert: ExternalSecretNotReady
          expr: |
            externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not syncing
            description: >-
              ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been
              Ready=False for 15m — its backing secret is not syncing (expired
              credential, missing key, or failed generator). Fix before a pod
              rollout forces a fresh fetch and crashloops. See orchestrator#51.

        # ESO metrics stopped being scraped — we'd be blind to the above.
        - alert: ExternalSecretsMetricsDown
          expr: |
            absent(externalsecret_status_condition)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: External Secrets Operator metrics are not being scraped
            description: >-
              No externalsecret_status_condition metrics for 30m. ESO scraping is
              broken (PodMonitor removed or controller down), so ExternalSecret
              sync failures would go undetected.
