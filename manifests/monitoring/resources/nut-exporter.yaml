# Prometheus exporter for the lab UPS (ADR-0028 in homelab-2.0). Reads the
# NUT server on ntp-01 without a login, so it can only read UPS variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app: nut-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nut-exporter
  template:
    metadata:
      labels:
        app: nut-exporter
    spec:
      containers:
        - name: nut-exporter
          image: druggeri/nut_exporter:3.3.0
          ports:
            - containerPort: 9199
              name: metrics
          env:
            - name: NUT_EXPORTER_SERVER
              value: "10.60.60.20"
            - name: NUT_EXPORTER_VARIABLES
              value: "battery.charge,battery.charge.low,battery.runtime,battery.runtime.low,battery.voltage,input.voltage,output.voltage,ups.load,ups.realpower.nominal,ups.status"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app: nut-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: nut-exporter
  ports:
    - port: 9199
      targetPort: metrics
      name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    app: nut-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app: nut-exporter
  endpoints:
    - port: metrics
      interval: 15s
      path: /ups_metrics
      params:
        ups:
          - "ups"
