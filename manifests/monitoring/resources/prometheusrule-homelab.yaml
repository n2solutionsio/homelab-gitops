apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: homelab-node-resources
      rules:
        # Node memory pressure — warning at 88%, critical at 90%.
        # Threshold sits above worker-1's normal ~79-85% baseline; `for` +
        # `keep_firing_for` add hysteresis so brief wobbles don't flap the
        # alert (see issue #172).
        - alert: NodeMemoryHigh
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 88
          for: 15m
          keep_firing_for: 30m
          labels:
            severity: warning
          annotations:
            description: >-
              Node {{ $labels.instance }} memory usage is {{ printf "%.1f" $value }}%
              (threshold: 88%).

        - alert: NodeMemoryCritical
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            description: >-
              Node {{ $labels.instance }} memory usage is {{ printf "%.1f" $value }}%
              (threshold: 90%). Risk of OOMKill.

        # Node CPU pressure — warning at 85%, critical at 95%
        - alert: NodeCPUHigh
          expr: |
            100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            description: >-
              Node {{ $labels.instance }} CPU usage is {{ printf "%.1f" $value }}%
              sustained for 10m (threshold: 85%).

        - alert: NodeCPUCritical
          expr: |
            100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            description: >-
              Node {{ $labels.instance }} CPU usage is {{ printf "%.1f" $value }}%
              sustained for 5m (threshold: 95%).

        # Node disk pressure — warning at 80%, critical at 90%
        - alert: NodeDiskHigh
          expr: |
            (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            description: >-
              Node {{ $labels.instance }} root disk usage is {{ printf "%.1f" $value }}%
              (threshold: 80%).

        - alert: NodeDiskCritical
          expr: |
            (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            description: >-
              Node {{ $labels.instance }} root disk usage is {{ printf "%.1f" $value }}%
              (threshold: 90%). Immediate action required.

    - name: homelab-pod-health
      rules:
        # Pod OOMKilled
        - alert: PodOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              was OOMKilled. Consider increasing memory limits.

        # Pod crash looping
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            description: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted
              {{ printf "%.0f" $value }} times in the last hour.

        # Pod not ready for extended period
        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{condition="true"} == 0
            and on(pod, namespace) kube_pod_status_phase{phase="Running"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            description: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has been not ready
              for more than 15 minutes.

    - name: homelab-cluster-health
      rules:
        # Node not ready
        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            description: >-
              Node {{ $labels.node }} has been NotReady for more than 5 minutes.

        # API server latency
        - alert: APIServerLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum(rate(apiserver_request_duration_seconds_bucket{verb!~"WATCH|CONNECT"}[5m])) by (le)
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            description: >-
              Kubernetes API server p99 latency is {{ printf "%.2f" $value }}s
              (threshold: 1s). API server may be under pressure.

        # PersistentVolume usage
        - alert: PVCNearFull
          expr: |
            kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            description: >-
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}
              is {{ printf "%.1f" $value }}% full (threshold: 85%).

    # ---------------------------------------------------------------------
    # Orchestrator Anthropic API health — input-token rate (ITPM), 429 rate,
    # and prompt-cache effectiveness. Metrics exposed by the orchestrator at
    # /metrics; see n2solutionsio/orchestrator src/orchestrator/metrics.py.
    # ---------------------------------------------------------------------
    - name: orchestrator-anthropic
      rules:
        # Any 429 propagating past the SDK's retry budget — user-visible
        # rate-limit failure. Fires within a minute of the first occurrence.
        - alert: AnthropicRateLimitHit
          expr: |
            increase(orchestrator_anthropic_rate_limit_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Anthropic 429 hit on {{ $labels.operation }} ({{ $labels.model }})
            description: >-
              Orchestrator received an Anthropic 429 within the last 5 minutes
              ({{ $value }} occurrences). The SDK's internal retries already
              failed. operation={{ $labels.operation }} model={{ $labels.model }}.

        # Approaching the 30k ITPM Tier 1 limit. Fires at 80% (24k tokens/min)
        # so we get a heads-up before users see 429s. Raise threshold when on
        # higher Anthropic tiers.
        - alert: AnthropicITPMApproachingLimit
          expr: |
            sum(rate(orchestrator_api_tokens_total{direction="input"}[1m])) * 60 > 24000
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Anthropic input tokens >80% of 30k ITPM Tier 1 limit
            description: >-
              Orchestrator input-token rate is {{ printf "%.0f" $value }} tokens/min
              against the 30k ITPM Tier 1 cap. Reduce fan-out, trim tool counts,
              or upgrade Anthropic tier. Cached tokens count separately and are
              not included in this number.

        # Prompt cache effectiveness — sustained low hit rate suggests the
        # cache_control wrapping isn't working (SDK mismatch, invalid markers,
        # or session churn defeating the 5-min ephemeral window). Informational
        # severity — useful signal, not page-worthy.
        - alert: AnthropicCacheHitRatioLow
          expr: |
            (
              sum(rate(orchestrator_api_tokens_total{direction="cache_read"}[15m]))
              /
              (
                sum(rate(orchestrator_api_tokens_total{direction="input"}[15m]))
                + sum(rate(orchestrator_api_tokens_total{direction="cache_read"}[15m]))
                > 0
              )
            ) < 0.5
          for: 30m
          labels:
            severity: info
          annotations:
            summary: Anthropic prompt cache hit ratio below 50% for 30 min
            description: >-
              Cache hit ratio is {{ printf "%.2f" $value }} over the last 15
              minutes (target ≥ 0.5). Expected ratio after the first call of
              a session is 0.7-0.9. If sustained, check that cache_control
              markers reach Anthropic (SDK version, request shape) and that
              conversation sessions aren't restarting more often than the
              5-min cache window.
