apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: ai-org
  labels:
    app: orchestrator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # RollingUpdate (not Recreate) so a missing or unhealthy image keeps
  # the old pod running indefinitely instead of taking the service down.
  # maxSurge=1 + maxUnavailable=0 means we briefly run 2 pods during a
  # roll — acceptable since orchestrator is stateless w.r.t. inbound
  # connections (Slack uses Socket Mode, outbound).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: ghcr.io/n2solutionsio/orchestrator:v0.1.13
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: orchestrator-secrets
            - configMapRef:
                name: orchestrator-config
          # Rotating GitHub App installation token (~1h TTL) mounted as a file.
          # github_client.py reads it fresh per request, so kubelet's atomic
          # update of the projected Secret is picked up without a restart.
          volumeMounts:
            - name: github-app-token
              mountPath: /var/run/secrets/github-app
              readOnly: true
          env:
            - name: GITHUB_TOKEN_FILE
              value: "/var/run/secrets/github-app/token"
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: HEALTH_PORT
              value: "8080"
            - name: SLACK_COMMAND_CHANNEL
              value: "C0AK3S3ATD3"
            - name: KAGENT_URL
              value: "http://kagent-controller.kagent.svc.cluster.local:8083"
            - name: APPROVAL_USER_IDS
              value: "U08PY23AFC4"
            # OpenTelemetry tracing — exports OTLP gRPC to Alloy, which
            # forwards to Tempo. Disable by removing OTEL_EXPORTER_OTLP_ENDPOINT
            # (tracing.init() gracefully no-ops without it).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy-otlp.logging.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "n2-orchestrator"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=ai-org,deployment.environment=homelab"
          ports:
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: github-app-token
          secret:
            secretName: orchestrator-github-token
