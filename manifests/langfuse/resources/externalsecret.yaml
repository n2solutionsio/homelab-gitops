# Assembles the langfuse-secrets Secret from OpenBao. sync-wave -1 so it exists
# before the Langfuse pods start (they mount these via secretKeyRef/existingSecret).
#
# App secrets live at OpenBao secret/langfuse (generate before first sync).
# Postgres/Redis passwords are REUSED from the existing paths the cluster
# already stores (postgres-admin, valkey) — no duplication.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
  data:
    - secretKey: salt
      remoteRef: { key: langfuse, property: salt }
    - secretKey: nextauth-secret
      remoteRef: { key: langfuse, property: nextauth-secret }
    - secretKey: encryption-key
      remoteRef: { key: langfuse, property: encryption-key }
    - secretKey: clickhouse-password
      remoteRef: { key: langfuse, property: clickhouse-password }
    - secretKey: s3-access-key
      remoteRef: { key: langfuse, property: s3-access-key }
    - secretKey: s3-secret-key
      remoteRef: { key: langfuse, property: s3-secret-key }
    # Reused from existing cluster secrets:
    - secretKey: postgres-password
      remoteRef: { key: postgres-admin, property: password }
    - secretKey: redis-password
      remoteRef: { key: valkey, property: password }
