operator:
  scanJobsConcurrentLimit: 3
  scannerReportTTL: "24h"

serviceMonitor:
  enabled: true

# Tolerate CP taint so node-collector can scan the control plane
nodeCollector:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

trivy:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
