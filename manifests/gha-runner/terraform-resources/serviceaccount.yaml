apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-runner
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: terraform-ci
# Dedicated identity for the terraform-only runner scale set. It has NO RBAC —
# it exists solely so the terraform CI runners present a distinct Kubernetes
# identity to OpenBao (k8s-auth role `terraform-ci` binds this SA), instead of
# sharing the general-purpose runner SA. Automounted SA token is used for the
# OpenBao login.
