controllerServiceAccount:
  name: gha-runner-controller-gha-rs-controller
  namespace: arc-systems

githubConfigUrl: https://github.com/n2solutionsio

githubConfigSecret: github-app-runner

minRunners: 0
maxRunners: 3

runnerGroup: default

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        # No 1Password token on org-wide runners: any workflow that can target
        # this label could read it. Playbooks that need 1Password run from an
        # operator workstation with `op run` instead.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
