## Bootstraps the 1Password ClusterSecretStore by projecting the 1P Service
## Account token (already stored in OpenBao at `op-sa-token/credential`) into
## the Secret that the store's serviceAccountSecretRef points at.
##
## sync-wave: 0 — must land before openbao-store / onepassword-store (both wave 1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-credentials
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: onepassword-credentials
    template:
      data:
        token: "{{ .credential }}"
  data:
    - secretKey: credential
      remoteRef:
        key: op-sa-token
        property: credential
