# Alloy Helm values — DaemonSet collector for k3s pod logs + syslog

controller:
  type: daemonset
  initContainers:
    - name: geoip-download
      image: curlimages/curl:8.7.1
      command: ['sh', '-c']
      args:
        - |
          curl -sSfL -o /geoip/GeoLite2-City.tar.gz \
            "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz" && \
          tar -xzf /geoip/GeoLite2-City.tar.gz -C /geoip --strip-components=1 && \
          rm /geoip/GeoLite2-City.tar.gz && \
          ls -la /geoip/GeoLite2-City.mmdb
      env:
        - name: MAXMIND_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: maxmind-license
              key: license-key
      volumeMounts:
        - name: geoip
          mountPath: /geoip
  volumes:
    extra:
      - name: geoip
        emptyDir: {}

alloy:
  mounts:
    varlog: true
    extra:
      - name: geoip
        mountPath: /geoip
        readOnly: true
  # Langfuse project API keys for the trace fan-out (see the trace pipeline).
  # optional=true so a missing/unsynced secret can NEVER break the collector —
  # sys.env() then returns "", the Langfuse export 401s, and Tempo is unaffected.
  extraEnv:
    - name: LANGFUSE_OTEL_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-otel-keys
          key: public-key
          optional: true
    - name: LANGFUSE_OTEL_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-otel-keys
          key: secret-key
          optional: true
  configMap:
    content: |
      // Find all pod log files on this node
      local.file_match "pod_logs" {
        path_targets = [{
          __path__ = "/var/log/pods/*/*/*.log",
        }]
      }

      // Read pod log files and add k8s labels via discovery
      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // Parse CRI log format and extract labels from file path
      loki.process "pod_logs" {
        // Extract namespace, pod, uid, container from path
        stage.regex {
          expression = "/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_(?P<uid>[^/]+)/(?P<container>[^/]+)/"
          source     = "filename"
        }
        stage.labels {
          values = {
            namespace = "",
            pod       = "",
            container = "",
          }
        }
        stage.cri {}
        stage.label_drop {
          values = ["uid"]
        }
        forward_to = [loki.write.loki.receiver]
      }

      // Receive syslog from network devices (UDP, RFC 3164)
      loki.source.syslog "network" {
        listener {
          address       = "0.0.0.0:5514"
          protocol      = "udp"
          syslog_format = "rfc3164"
          labels        = { job = "syslog" }
        }
        forward_to = [loki.process.syslog_geoip.receiver]
      }

      // Enrich firewall logs with GeoIP data from MaxMind
      loki.process "syslog_geoip" {
        // Extract source IP from firewall log lines (SRC=x.x.x.x)
        stage.regex {
          expression = "SRC=(?P<src_ip>[\\d.]+)"
        }

        // Look up IP in MaxMind GeoLite2-City database
        stage.geoip {
          source  = "src_ip"
          db      = "/geoip/GeoLite2-City.mmdb"
          db_type = "city"
        }

        // Attach geo fields as structured metadata (not labels — avoids cardinality explosion)
        stage.structured_metadata {
          values = {
            geoip_country_name       = "",
            geoip_country_code       = "",
            geoip_city_name          = "",
            geoip_location_latitude  = "",
            geoip_location_longitude = "",
            geoip_continent_name     = "",
          }
        }

        forward_to = [loki.write.loki.receiver]
      }

      // Push to Loki via gateway
      loki.write "loki" {
        endpoint {
          url = "http://loki-gateway.logging.svc.cluster.local:80/loki/api/v1/push"
        }
      }

      // ===== Trace pipeline (OpenTelemetry) =====
      // Receive OTLP traces from in-cluster apps (orchestrator first; kagent later).
      // Apps target the Alloy ClusterIP Service on :4317 (gRPC) or :4318 (HTTP).
      otelcol.receiver.otlp "traces" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          // Tempo gets ALL traces (infra tracing). Langfuse gets only agent/LLM
          // traces, via the tail_sampling filter below.
          traces = [
            otelcol.exporter.otlp.tempo.input,
            otelcol.processor.tail_sampling.langfuse.input,
          ]
        }
      }

      // Only forward agent/LLM traces to Langfuse: keep a WHOLE trace iff it
      // contains a span with a gen_ai.* attribute (the actual LLM work). This
      // drops health/readiness/metrics probe traces so the eval store stays
      // clean, without mangling the agent trace's internal HTTP spans (a
      // span-level filter would). Trace-level decision after decision_wait.
      otelcol.processor.tail_sampling "langfuse" {
        decision_wait = "30s"
        policy {
          name = "keep-genai-traces"
          type = "string_attribute"
          string_attribute {
            key                    = "gen_ai.system"
            values                 = [".+"]
            enabled_regex_matching = true
          }
        }
        output {
          traces = [otelcol.exporter.otlphttp.langfuse.input]
        }
      }

      // Forward traces to Tempo (single-binary mode, OTLP gRPC ingest).
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.tracing.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

      // Also send traces to Langfuse via its OTLP endpoint, for LLM
      // observability + evaluation. Basic auth uses the project public/secret
      // API keys (injected as env from the langfuse-otel-keys secret). If the
      // keys are absent this export just 401s — the Tempo path is independent.
      otelcol.exporter.otlphttp "langfuse" {
        client {
          endpoint = "http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel"
          auth     = otelcol.auth.basic.langfuse.handler
        }
      }

      otelcol.auth.basic "langfuse" {
        username = sys.env("LANGFUSE_OTEL_PUBLIC_KEY")
        password = sys.env("LANGFUSE_OTEL_SECRET_KEY")
      }

extraPorts:
  - name: syslog-udp
    port: 5514
    targetPort: 5514
    protocol: UDP
