# Langfuse project API keys (public/secret) for Alloy's OTLP trace export to
# Langfuse. Pulled from OpenBao secret/langfuse-otel into the langfuse-otel-keys
# Secret, which Alloy references as optional env (see manifests/alloy/values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-otel-keys
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: langfuse-otel-keys
  data:
    - secretKey: public-key
      remoteRef:
        key: langfuse-otel
        property: public-key
    - secretKey: secret-key
      remoteRef:
        key: langfuse-otel
        property: secret-key
