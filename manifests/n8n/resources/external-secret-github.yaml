# GitHub Personal Access Token for n8n's GitHub node — used by the
# alert-incident-pipeline workflow to create/comment/close issues on
# n2solutionsio/homelab-gitops.
#
# Provisioning:
#   1. Generate a fine-grained PAT at https://github.com/settings/tokens?type=beta
#      with scope: Repository → Issues: Read and write, Contents: Read-only
#   2. Store in OpenBao at path `n8n-github` with property `token`
#      (e.g. `bao kv put kv/n8n-github token=ghp_xxx`)
#   3. Once this ExternalSecret syncs, the Secret `n8n-github-credentials`
#      will exist in the n8n namespace. Reference it in n8n's Credentials
#      UI (Credentials → New → GitHub API → "Access Token" → paste the
#      value from the Secret, or use n8n's k8s integration to mount it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-github-credentials
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: n8n-github-credentials
    template:
      data:
        GITHUB_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: n8n-github
        property: token
