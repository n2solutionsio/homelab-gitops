# kagent Helm values — Anthropic provider, K8s + Helm + PromQL agents
# Chart: kagent/helm/kagent 0.9.8
#
# Schema note (0.9.x): sub-charts (agents and tools) are top-level keys.
# The `agents:` and `tools:` nesting from 0.7.x has been removed.

# Database — use existing PostgreSQL cluster.
# Bundled Postgres in 0.9.x defaults to enabled; we explicitly disable it
# so the chart does not stand up a second Postgres alongside our external one.
# URL is injected from ExternalSecret via volume mount (urlFile takes precedence over url).
database:
  postgres:
    vectorEnabled: true
    url: ""
    urlFile: /etc/kagent-db/url
    bundled:
      enabled: false

# Controller
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2
      memory: 512Mi
  volumes:
    - name: db-url
      secret:
        secretName: kagent-db-url
  volumeMounts:
    - name: db-url
      mountPath: /etc/kagent-db
      readOnly: true

# UI
ui:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# LLM Provider — Anthropic Claude (default)
providers:
  default: anthropic
  anthropic:
    provider: Anthropic
    model: claude-sonnet-4-5-20250929
    apiKeySecretRef: kagent-anthropic
    apiKeySecretKey: api-key

# Agents — enable only what we need, disable the rest.
# (0.9.x: these are top-level keys, not nested under `agents:`.)
k8s-agent:
  enabled: true
helm-agent:
  enabled: true
observability-agent:
  enabled: true
promql-agent:
  enabled: true
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
cilium-policy-agent:
  enabled: true
cilium-manager-agent:
  enabled: true
cilium-debug-agent:
  enabled: true

# MCP infrastructure
kmcp:
  enabled: true

kagent-tools:
  enabled: true

# Tools.
# (0.9.x: these are top-level keys, not nested under `tools:`.)
#
# grafana-mcp is required by observability-agent — that agent's spec
# references RemoteMCPServer "kagent-grafana-mcp" which the grafana-mcp
# sub-chart creates. We point the sub-chart at our cluster's Grafana and
# reuse the same ExternalSecret-backed credentials our existing custom
# grafana-mcp-server uses.
grafana-mcp:
  enabled: true
  grafana:
    url: "http://monitoring-grafana.monitoring.svc.cluster.local:80"
    secretRef: grafana-mcp-credentials
querydoc:
  enabled: false
