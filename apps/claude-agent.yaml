apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claude-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/n2solutionsio/homelab-gitops.git
      targetRevision: main
      path: manifests/claude-agent/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: claude-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
